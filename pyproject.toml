[project]
name = "learnloop-agent"
version = "0.1.0"
description = "Local-first Notion knowledge agent backend."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "alembic>=1.16.0,<2.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "pillow>=11.0.0,<12.0.0",
    "pypdf>=6.0.0,<7.0.0",
    "pytesseract>=0.3.13,<1.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "trafilatura>=2.0.0,<3.0.0",
    "youtube-transcript-api>=1.2.0,<2.0.0",
    "uvicorn>=0.30.0,<1.0.0",
]

[project.optional-dependencies]
legacy-worker = [
    "rq>=2.0.0,<3.0.0",
]

[dependency-groups]
dev = [
    "fakeredis>=2.32.0,<3.0.0",
    "httpx>=0.28.0,<1.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    "pytest>=8.0.0,<9.0.0",
    "rq>=2.0.0,<3.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = ["parser_note_completeness"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

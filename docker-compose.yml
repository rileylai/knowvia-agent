name: knowvia

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: knowvia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-knowvia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knowvia}
      POSTGRES_DB: ${POSTGRES_DB:-knowvia}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - knowvia-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-knowvia} -d ${POSTGRES_DB:-knowvia}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: knowvia-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./data/redis:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  knowvia-postgres-data:
    name: knowvia-postgres-data
